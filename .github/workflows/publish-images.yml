name: Publish images

# Publishes both images to GitHub Container Registry so nobody has to clone the
# repository to use the lab:
#
#   ghcr.io/micheltlutz/dev-challenge            the reference API
#   ghcr.io/micheltlutz/dev-challenge-harness    the verification harness
#
# Both build from the repository root: the harness image copies specs/ in, since
# the scorecard quotes the acceptance criteria.

on:
  release:
    types: [published]
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (e.g. edge). latest is always updated."
        required: false
        default: "edge"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: dev-challenge
            dockerfile: Dockerfile
          - name: harness
            image: dev-challenge-harness
            dockerfile: harness/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=dev-challenge ${{ matrix.name }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # arm64 matters here: most people running this lab are on Apple silicon.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # Prove the published images actually work together before anyone pulls them.
  smoke-test:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Start the published API
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SECRET=publish-smoke-test \
            ghcr.io/${{ github.repository_owner }}/dev-challenge:latest
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/health-check && break
            sleep 2
          done
          curl -sf http://localhost:8000/health-check

      - name: Verify it with the published harness
        run: |
          docker run --rm --network host -v "$PWD:/out" \
            ghcr.io/${{ github.repository_owner }}/dev-challenge-harness:latest \
            --base-url http://localhost:8000 \
            --report-json /out/scorecard.json

      - name: Fail if the reference does not satisfy its own criteria
        run: |
          python - <<'PY'
          import json, sys
          report = json.load(open("scorecard.json"))
          print(json.dumps(report["summary"], indent=2))
          if report["summary"]["failed"] or report["summary"]["skipped"]:
              for c in report["criteria"]:
                  if c["status"] in ("failed", "skipped"):
                      print(f"  {c['status'].upper():7} {c['id']}  {c['title']}")
                      if c["detail"]:
                          print(f"          {c['detail']}")
              sys.exit(1)
          PY
